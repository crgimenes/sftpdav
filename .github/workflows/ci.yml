name: test

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    name: test-${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: CGO_ENABLED=0 go build ./...
      - run: go vet ./...
      - run: go test -race -shuffle=on -count 1 -timeout 60s ./...
      # webdav/ is a separate module, so the root ./... above does not reach it.
      - name: webdav module
        working-directory: webdav
        run: |
          CGO_ENABLED=0 go build ./...
          go vet ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go.mod tidy
        run: |
          go mod tidy -diff || { echo "go.mod/go.sum not tidy: run go mod tidy"; exit 1; }
          (cd webdav && go mod tidy -diff) || { echo "webdav not tidy: run (cd webdav && go mod tidy)"; exit 1; }
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      - name: Lint (every GOOS)
        run: |
          for os in darwin linux; do
            echo "== GOOS=$os =="
            GOOS=$os $(go env GOPATH)/bin/golangci-lint run ./...
            (cd webdav && GOOS=$os $(go env GOPATH)/bin/golangci-lint run ./...)
          done
